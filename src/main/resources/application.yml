server:
  port: 8081

spring:
  application:
    name: manantial-ms-customers
  jackson:
    default-property-inclusion: NON_NULL
  data:
    mongodb:
      uri: ${DB_HOST:mongodb://localhost:27017/customer_db?authSource=admin}
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:1234}
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost:9092}
management:
  endpoints:
    web:
      exposure:
        include: health, metrics, info, prometheus
    endpoint:
      prometheus:
        enabled: true
    metrics:
      enable:
        jvm: true
        logback: true
      export:
        prometheus:
          enabled: true
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    url: /v3/api-docs
  openapi:
    info:
      title: Microservices customers
      version: 1.0.0
      description: API documentation for Microservice customers
file_path:
  customer:
    information: ${PATH_CUSTOMERS:customers/pdf}
storage:
  type: ${STORAGE_TYPE:s3} # Options: local, s3, blob
amazon:
  region: ${AWS_REGION:REGION}
  access_key: ${AWS_S3_ACCESS_KEY:ACCESS_KEY}
  secret_key: ${AWS_S3_SECRET_KEY:SECRET_KEY}
  s3:
    bucket: ${AWS_S3_BUCKET:BUCKET_NAME}
