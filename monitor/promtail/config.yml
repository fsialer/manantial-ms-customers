server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: customer-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: customer-service
          __path__: /var/log/customer-service/*.log
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2}T[^ ]+) (?P<level>INFO|ERROR|WARN|DEBUG)'
      - labels:
          level: ""
  - job_name: consumer-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: consumer-service
          __path__: /var/log/consumer-service/*.log
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2}T[^ ]+) (?P<level>INFO|ERROR|WARN|DEBUG)'
      - labels:
          level: ""