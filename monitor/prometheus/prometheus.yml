global:
  scrape_interval: 15s
  evaluation_interval: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - rules.yml

scrape_configs:
  - job_name: 'keycloak-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ["keycloak-server:8080"]
    relabel_configs:
      - source_labels: [ __address__ ]
        target_label: instance
        replacement: 'keycloak-server:8080'
      - target_label: job
        replacement: 'keycloak-server'
      - target_label: type
        replacement: 'backend'
  - job_name: 'customer-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['customer-service:8081']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'customer-service:8081'
      - target_label: job
        replacement: 'customer-service'
      - target_label: type
        replacement: 'backend'

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'node-exporter:9100'
      - target_label: job
        replacement: 'node'
      - target_label: type
        replacement: 'monitoring'
