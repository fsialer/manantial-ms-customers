services:
  zookeeper:
    image: wurstmeister/zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    networks:
      - customers-net
    restart: unless-stopped

  kafka:
    image: wurstmeister/kafka
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: ${KAFKA_BROKER_ID}
      KAFKA_ZOOKEEPER_CONNECT: ${KAFKA_ZOOKEEPER_CONNECT}
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP}
      KAFKA_INTER_BROKER_LISTENER_NAME: ${KAFKA_INTER_BROKER_LISTENER_NAME}
      KAFKA_ADVERTISED_HOST_NAME: ${KAFKA_ADVERTISED_HOST_NAME}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR}
      KAFKA_LISTENERS: ${KAFKA_LISTENERS}
    depends_on:
      - zookeeper
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 5
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - customers-net
    restart: unless-stopped

  mongo6:
    image: mongo:6.0
    container_name: mongo6
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_vol:/data/db
    networks:
      - customers-net
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: redis
    ports:
      - "6379:6379"  # puerto por defecto de Redis
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - customers-net

  keycloak-server:
    image: quay.io/keycloak/keycloak:24.0.2
    container_name: keycloak_2
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    command: ["start-dev","--health-enabled=true", "--metrics-enabled=true"]
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health/ready" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - customers-net
    restart: unless-stopped
    volumes:
      - keycloak_data:/opt/keycloak/data

  customer-service:
    image: manantial-ms-customers:latest
    container_name: customer-service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: ${MONGO_CUSTOMER_HOST}
      DB_USERNAME: ${MONGO_USER}
      DB_PASSWORD: ${MONGO_PASSWORD}
      KAFKA_HOST: ${KAFKA_HOST}
    depends_on:
      - mongo6
      - kafka
    restart: unless-stopped
    volumes:
      - ./monitor/log/customer-service:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 90s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
      - customers-net

  consumer-service:
    image: feralexis007/manantial-ms-consumer:dev-722fb6a
    container_name: consumer-service
    ports:
      - "8099:8099"
    environment:
      KAFKA_HOST: ${KAFKA_HOST}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      STORAGE_TYPE: ${STORAGE_TYPE}
      PATH_CUSTOMERS: ${PATH_CUSTOMERS}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_ACCESS_KEY: ${AWS_S3_ACCESS_KEY}
      AWS_S3_SECRET_KEY: ${AWS_S3_SECRET_KEY}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
    volumes:
      - ./monitor/log/consumer-service:/app/logs
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8099/actuator/health" ]
      interval: 90s
      timeout: 30s
      retries: 5
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - customers-net

  manantial-gateway:
    image: manantial-gateway:latest
    container_name: manantial-gateway
    environment:
      AUTH_SERVER: ${AUTH_SERVER}
      CUSTOMER_URL: ${CUSTOMER_URL}
      CLIENT_ID: ${CLIENT_ID}
      CUSTOMER_BASEURL: ${CUSTOMER_BASEURL}
    ports:
      - "8090:8090"
    networks:
      - customers-net
    depends_on:
#      keycloak-server:
#        condition: service_healthy
#      customer-service:
#        condition: service_healthy
#      consumer-service:
#        condition: service_healthy
      - keycloak-server
      - customer-service
      - consumer-service
    restart: unless-stopped

networks:
  customers-net:
    driver: bridge

volumes:
  mongo_vol:
  keycloak_data:
  redis_data: