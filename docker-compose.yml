services:
  zookeeper:
    image: wurstmeister/zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    networks:
      - customers-net
    restart: unless-stopped

  kafka:
    image: wurstmeister/kafka
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: ${KAFKA_BROKER_ID}
      KAFKA_ZOOKEEPER_CONNECT: ${KAFKA_ZOOKEEPER_CONNECT}
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP}
      KAFKA_INTER_BROKER_LISTENER_NAME: ${KAFKA_INTER_BROKER_LISTENER_NAME}
      KAFKA_ADVERTISED_HOST_NAME: ${KAFKA_ADVERTISED_HOST_NAME}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR}
      KAFKA_LISTENERS: ${KAFKA_LISTENERS}
    depends_on:
      - zookeeper
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 5
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - customers-net
    restart: unless-stopped

  mongo6:
    image: mongo:6.0
    container_name: mongo6
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_vol:/data/db
    networks:
      - customers-net
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: redis
    ports:
      - "6379:6379"  # puerto por defecto de Redis
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - customers-net

  keycloak-server:
    image: quay.io/keycloak/keycloak:24.0.2
    container_name: keycloak_2
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    command: ["start-dev","--health-enabled=true", "--metrics-enabled=true"]
    ports:
      - "8080:8080"
    networks:
      - customers-net
    restart: unless-stopped
    volumes:
      - keycloak_data:/opt/keycloak/data

  customer-service:
    image: manantial-ms-customers:latest
    container_name: customer-service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: ${MONGO_CUSTOMER_HOST}
      DB_USERNAME: ${MONGO_USER}
      DB_PASSWORD: ${MONGO_PASSWORD}
      KAFKA_HOST: ${KAFKA_HOST}
    depends_on:
      - mongo6
      - kafka
    restart: unless-stopped
    volumes:
      - ./monitor/log/customer-service:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 90s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
      - customers-net

  consumer-service:
    image: manantial-ms-consumer:latest
    container_name: consumer-service
    ports:
      - "8099:8099"
    environment:
      DB_HOST: ${MONGO_CONSUMER_HOST}
      DB_USERNAME: ${MONGO_USER}
      DB_PASSWORD: ${MONGO_PASSWORD}
      KAFKA_HOST: ${KAFKA_HOST}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./monitor/log/consumer-service:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - customers-net

  manantial-gateway:
    image: manantial-gateway:latest
    container_name: manantial-gateway
    environment:
      AUTH_SERVER: ${AUTH_SERVER}
      CUSTOMER_URL: ${CUSTOMER_URL}
      CLIENT_ID: ${CLIENT_ID}
      CUSTOMER_BASEURL: ${CUSTOMER_BASEURL}
    ports:
      - "8090:8090"
    networks:
      - customers-net
    depends_on:
      - keycloak-server
      - customer-service
    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitor/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitor/prometheus/rules.yml:/etc/prometheus/rules.yml
    networks:
      - customers-net
    depends_on:
      - alertmanager
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter
    container_name: node-exporter
    ports:
      - "9100:9100"
    networks:
      - customers-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana-vol:/var/lib/grafana
      - ./monitor/grafana/provisioning:/etc/grafana/provisioning
      - ./monitor/grafana/dashboards:/etc/grafana/dashboards
    networks:
      - customers-net
    depends_on:
      - prometheus
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./monitor/loki/config.yml:/etc/loki/config.yml:ro
      - grafana-vol:/tmp/loki
    networks:
      - customers-net

  promtail:
    image: grafana/promtail:2.9.0
    volumes:
      - ./monitor/promtail/config.yml:/etc/promtail/config.yml:ro
      - ./monitor/log:/var/log           # O los logs de tus contenedores
    command: -config.file=/etc/promtail/config.yml
    networks:
      - customers-net

  alertmanager:
    container_name: alertmanager
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    volumes:
      - ./monitor/alerts/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    networks:
      - customers-net

  alertmanager-discord-relay:
    container_name: alertmanager-discord-relay
    image: benjojo/alertmanager-discord:latest
    environment:
      DISCORD_WEBHOOK: ${DISCORD_WEBHOOK}
      DISCORD_USERNAME: ${DISCORD_USERNAME}
      DEBUG: true
    networks:
      - customers-net
    depends_on:
      - alertmanager
    restart: unless-stopped

networks:
  customers-net:
    driver: bridge

volumes:
  grafana-vol:
  mongo_vol:
  keycloak_data:
  redis_data:
  loki_data: