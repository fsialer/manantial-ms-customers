apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kubernetes.io/change-cause: "Image feralexis007/manantial-ms-consumer:prod-3d97c0c"
  name: backend-consumer-deployment-prod
  labels:
    app: back-consumer-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: back-consumer-prod
  template:
    metadata:
      labels:
        app: back-consumer-prod
    spec:
      containers:
        - name: consumer-service
          image: feralexis007/manantial-ms-consumer:prod-3d97c0c
          imagePullPolicy: Always
          securityContext:
            runAsUser: 10002
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8099
          env:
            - name: KAFKA_HOST
              valueFrom:
                configMapKeyRef:
                  name: back-consumer-prod
                  key: kafka_host
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: back-consumer-prod
                  key: redis_host
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: back-consumer-prod
                  key: redis_port
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secrets-prod
                  key: redis_password
            - name: STORAGE_TYPE
              valueFrom:
                configMapKeyRef:
                  name: back-consumer-prod
                  key: storage_type
            - name: STORAGE_PATH
              valueFrom:
                configMapKeyRef:
                  name: back-consumer-prod
                  key: storage_path
          resources:
            requests:
              memory: "500Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health   # <-- Asegúrate de que este endpoint existe en tu app
              port: 8099
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8099
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend-consumer-service-prod
spec:
  type: ClusterIP
  selector:
    app: back-consumer-prod
  ports:
    - protocol: TCP
      port: 8099
      targetPort: 8099