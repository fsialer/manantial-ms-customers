apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kubernetes.io/change-cause: "Image feralexis007/manantial-gateway:prod-35df0c4"
  name: backend-gateway-deployment-prod
  labels:
    app: back-gateway-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: back-gateway-prod
  template:
    metadata:
      labels:
        app: back-gateway-prod
    spec:
      containers:
        - name: gateway-service
          image: feralexis007/manantial-gateway:prod-35df0c4
          imagePullPolicy: Always
          securityContext:
            runAsUser: 10003
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8090
          env:
            - name: AUTH_SERVER
              valueFrom:
                configMapKeyRef:
                  name: back-gateway-prod
                  key: auth_server
            - name: CUSTOMER_URL
              valueFrom:
                configMapKeyRef:
                  name: back-gateway-prod
                  key: customers_url
            - name: CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets-prod
                  key: keycloak_client_id
            - name: CUSTOMER_BASEURL
              valueFrom:
                configMapKeyRef:
                  name: back-gateway-prod
                  key: customer_baseurl
          resources:
            requests:
              memory: "500Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health   # <-- Asegúrate de que este endpoint existe en tu app
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend-gateway-service-prod
spec:
  type: ClusterIP
  selector:
    app: back-gateway-prod
  ports:
    - protocol: TCP
      port: 8090
      targetPort: 8090
