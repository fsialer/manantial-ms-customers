apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-keycloak-ingress-prod
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
spec:
  ingressClassName: nginx
  rules:
    - host: manantial.test
      http:
        paths:
        - path: /api
          pathType: Prefix
          backend:
            service:
              name: backend-gateway-service-prod
              port:
                number: 8090
    - host: manantial.test
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: keycloak-prod
              port:
                number: 80
