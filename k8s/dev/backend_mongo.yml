apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongo-pv-dev
spec:
  storageClassName: standard
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /data/db
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-pvc-dev
spec:
  volumeName: mongo-pv-dev
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo6-deployment-dev
  labels:
    app: mongo-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-dev
  template:
    metadata:
      labels:
        app: mongo-dev
    spec:
      containers:
        - image: mongo:6.0
          name: mongo6
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongo-secrets-dev
                  key: mongo_user
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-secrets-dev
                  key: mongo_password
          volumeMounts:
            - name: mongo-dev
              mountPath: /data/db
      volumes:
        - name: mongo-dev
          persistentVolumeClaim:
            claimName: mongo-pvc-dev
---
apiVersion: v1
kind: Service
metadata:
  name: mongo6-service-dev
spec:
  type: ClusterIP
  selector:
    app: mongo-dev
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
