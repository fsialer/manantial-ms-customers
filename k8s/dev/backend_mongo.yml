apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongo-pv-dev
spec:
  storageClassName: standard
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /data/db
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-pvc-dev
spec:
  volumeName: mongo-pv-dev
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo6-deployment-dev
  labels:
    app: mongo-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-dev
  template:
    metadata:
      labels:
        app: mongo-dev
    spec:
      securityContext:
            fsGroup: 10001
      initContainers:
        - name: fix-permissions
          image: busybox
#          imagePullPolicy: Always
#          securityContext:
#            runAsUser: 0
#            runAsGroup: 10001
#            runAsNonRoot: true
#            readOnlyRootFilesystem: false
#            allowPrivilegeEscalation: false
#            capabilities:
#              drop:
#                - ALL
          command: ["sh", "-c", "chown -R 10001:10001 /data/db"]
          volumeMounts:
            - name: mongo-dev
              mountPath: /data/db
          resources:
            requests:
              memory: "250Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      containers:
        - image: mongo:6.0
          name: mongo6
          imagePullPolicy: Always
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongo-secrets-dev
                  key: mongo_user
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-secrets-dev
                  key: mongo_password
          volumeMounts:
            - name: mongo-dev
              mountPath: /data/db
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "250Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
      volumes:
        - name: mongo-dev
          persistentVolumeClaim:
            claimName: mongo-pvc-dev
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mongo6-service-dev
spec:
  type: ClusterIP
  selector:
    app: mongo-dev
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
