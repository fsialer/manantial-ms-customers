apiVersion: v1
kind: ConfigMap
metadata:
  name: back-gateway-dev
data:
  auth_server: http://manantial.dev.test/realms/manantial-realm
  customers_url: http://backend-customer-service-dev:8081/v1/customers
  customer_baseurl: http://backend-customer-service-dev:8081

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: back-customer-dev
data:
  db_name: customers_db
  db_host:  mongodb://admin:admin@mongo6-service-dev:27017/customers_db?authSource=admin
  kafka_host: kafka-dev:9092

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: back-consumer-dev
data:
  kafka_host: kafka-dev:9092
  redis_host: redis7-service-dev
  redis_port: "6379"
  storage_type: local
  storage_path: /pdfs
