replicaCount: 2

auth:
  enabled: true
  clientProtocol: plaintext
  interBrokerProtocol: plaintext

externalAccess:
  enabled: false

persistence:
  enabled: true
  size: 10Gi

zookeeper:
  enabled: true
  replicaCount: 2
  persistence:
    enabled: true
    size: 5Gi

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "1000m"
    memory: "2Gi"
