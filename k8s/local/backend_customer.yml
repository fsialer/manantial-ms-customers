apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kubernetes.io/change-cause: "Image feralexis007/manantial-customers-service:dev-1704a98"
  name: backend-customer-deployment-local
  labels:
    app: back-customer-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: back-customer-local
  template:
    metadata:
      labels:
        app: back-customer-local
    spec:
      containers:
        - name: customers-service
          image: feralexis007/manantial-customers-service:dev-1704a98
          imagePullPolicy: Always
          securityContext:
            runAsUser: 10001
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8081
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: back-customer-local
                  key: db_host
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongo-secrets-local
                  key: mongo_user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-secrets-local
                  key: mongo_password
            - name: KAFKA_HOST
              valueFrom:
                configMapKeyRef:
                  name: back-customer-local
                  key: kafka_host
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health   # <-- Asegúrate de que este endpoint existe en tu app
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: backend-customer-service-local
spec:
  type: ClusterIP
  selector:
    app: back-customer-local
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081