apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongo-pv-local
spec:
  storageClassName: standard
  capacity:
    storage: 2Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /data/db
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-pvc-local
spec:
  volumeName: mongo-pv-local
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo6-deployment-local
  labels:
    app: mongo-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-local
  template:
    metadata:
      labels:
        app: mongo-local
    spec:
      containers:
        - image: mongo:6.0
          name: mongo6
          imagePullPolicy: Always
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongo-secrets-local
                  key: mongo_user
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-secrets-local
                  key: mongo_password
          volumeMounts:
            - name: mongo-local
              mountPath: /data/db
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "250Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
              initialDelaySeconds: 30
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
      volumes:
        - name: mongo-local
          persistentVolumeClaim:
            claimName: mongo-pvc-local
        - name: tmp
          emptyDir: { }
---
apiVersion: v1
kind: Service
metadata:
  name: mongo6-service-local
spec:
  type: ClusterIP
  selector:
    app: mongo-local
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
